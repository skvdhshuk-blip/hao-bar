name: SaneBar
options:
  bundleIdPrefix: com.haobar
  deploymentTarget:
    macOS: 14.0
  xcodeVersion: 16.0
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - de
    - fr
    - es
    - pt-BR
    - it
    - nl
    - vi
    - th
    - id
    - Base

configs:
  Debug: debug
  Debug-AppStore: debug
  Release-AppStore: release

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  SaneUI:
    url: https://github.com/sane-apps/SaneUI.git
    revision: 3850741e78a539cc130697bae7ffa5ac9741508a
settings:
  DEAD_CODE_STRIPPING: YES
  SWIFT_EMIT_LOC_STRINGS: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  ENABLE_HARDENED_RUNTIME: YES
  GENERATE_INFOPLIST_FILE: YES
  DEVELOPMENT_TEAM: M2WM2NJP68
  # Recommended warnings
  CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
  CLANG_WARN_BOOL_CONVERSION: YES
  CLANG_WARN_COMMA: YES
  CLANG_WARN_CONSTANT_CONVERSION: YES
  CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
  CLANG_WARN_EMPTY_BODY: YES
  CLANG_WARN_ENUM_CONVERSION: YES
  CLANG_WARN_INFINITE_RECURSION: YES
  CLANG_WARN_INT_CONVERSION: YES
  CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
  CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
  CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
  CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
  CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
  CLANG_WARN_STRICT_PROTOTYPES: YES
  CLANG_WARN_SUSPICIOUS_MOVE: YES
  CLANG_WARN_UNREACHABLE_CODE: YES
  CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
  ENABLE_STRICT_OBJC_MSGSEND: YES
  GCC_NO_COMMON_BLOCKS: YES
  GCC_WARN_64_TO_32_BIT_CONVERSION: YES
  GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
  GCC_WARN_UNDECLARED_SELECTOR: YES
  GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
  GCC_WARN_UNUSED_FUNCTION: YES
  GCC_WARN_UNUSED_VARIABLE: YES
  SWIFT_STRICT_CONCURRENCY: complete

schemes:
  SaneBar:
    build:
      targets:
        SaneBar: all
        SaneBarTests: [test]
    test:
      targets:
        - SaneBarTests
    profile:
      config: Debug
    run:
      config: Debug
    archive:
      config: Release-AppStore

  HaoBar:
    build:
      targets:
        SaneBar: all
        SaneBarTests: [test]
    test:
      targets:
        - SaneBarTests
    profile:
      config: Debug-AppStore
    run:
      config: Debug-AppStore
    archive:
      config: Release-AppStore

targets:
  SaneBar:
    type: application
    platform: macOS
    bundleId: com.haobar.app
    deploymentTarget:
      macOS: 14.0
    sources:
      - main.swift
      - SaneBarApp.swift
      - path: Core
        excludes:
          - "**/CLAUDE.md"
      - path: UI
        excludes:
          - "**/CLAUDE.md"
      - Resources
      - SaneBar/PrivacyInfo.xcprivacy
    dependencies:
      - package: KeyboardShortcuts
      - package: SaneUI
    info:
      path: SaneBar/Info.plist
      properties:
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: SaneBar.sdef
        NSAppleEventsUsageDescription: "HaoBar uses Apple Events so Shortcuts and AppleScript can control HaoBar itself."
        NSAccessibilityUsageDescription: "HaoBar needs accessibility permission to detect and arrange menu bar icons."
        NSScreenCaptureUsageDescription: "HaoBar snapshots the menu bar so hidden icons can appear in the popup bar. It does not record video or upload anything."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: HaoBar
        CFBundleURLTypes:
          - CFBundleURLName: "com.haobar.app"
            CFBundleURLSchemes:
              - "haobar"
        LSApplicationCategoryType: "public.app-category.utilities"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: HaoBar
        PRODUCT_MODULE_NAME: SaneBar
        PRODUCT_BUNDLE_IDENTIFIER: com.haobar.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "103"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        ENABLE_XOJIT_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ARCHS: arm64
        VALID_ARCHS: arm64
        DEVELOPMENT_TEAM: M2WM2NJP68
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.haobar.app
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
          CODE_SIGN_ENTITLEMENTS: ""
        Debug-AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.haobar.app
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_APP_SANDBOX: YES
          OTHER_SWIFT_FLAGS: "$(inherited) -D APP_STORE"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APP_STORE"
          CODE_SIGN_ENTITLEMENTS: SaneBar/SaneBar-AppStore.entitlements
        Release-AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.haobar.app
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_APP_SANDBOX: YES
          OTHER_SWIFT_FLAGS: "$(inherited) -D APP_STORE"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APP_STORE"
          CODE_SIGN_ENTITLEMENTS: SaneBar/SaneBar-AppStore.entitlements
    postCompileScripts:
      - script: |
          export PATH="/opt/homebrew/bin:$PATH"
          if which swiftlint >/dev/null; then
            swiftlint . || true
          else
            echo "warning: SwiftLint not installed"
          fi
        name: Run SwiftLint
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Sign embedded resource bundles
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # 101 failed App Store processing (90284) because this signed SPM
          # resource bundles with Apple Development. Export resigns the app
          # with Distribution; leave Release archives for that step.
          if [ "${CONFIGURATION:-}" = "Release-AppStore" ]; then
            echo "skip bundle signing: App Store export resigns with Distribution"
            exit 0
          fi
          if [ "${CODE_SIGNING_ALLOWED:-}" != "YES" ]; then
            echo "skip bundle signing: CODE_SIGNING_ALLOWED=${CODE_SIGNING_ALLOWED:-unset}"
            exit 0
          fi
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ] || [ "$IDENTITY" = "-" ]; then
            echo "skip bundle signing: no development identity"
            exit 0
          fi
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          RESOURCES="${APP}/Contents/Resources"
          [ -d "$RESOURCES" ] || exit 0
          find "$RESOURCES" -name '*.bundle' -print0 | while IFS= read -r -d '' bundle; do
            echo "Signing $bundle with ${EXPANDED_CODE_SIGN_IDENTITY_NAME:-$IDENTITY}"
            /usr/bin/codesign --force --sign "$IDENTITY" --timestamp=none --generate-entitlement-der "$bundle"
          done

  SaneBarTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.haobar.appTests
    deploymentTarget:
      macOS: 14.0
    testTarget: SaneBar
    sources:
      - path: Tests
        excludes:
          - "**/CLAUDE.md"
    dependencies:
      - target: SaneBar
    settings:
      base:
        PRODUCT_MODULE_NAME: SaneBarTests
        DEVELOPMENT_TEAM: M2WM2NJP68
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HaoBar.app/Contents/MacOS/HaoBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug-AppStore:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release-AppStore:
          CODE_SIGN_IDENTITY: "Apple Development"
